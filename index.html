                    <p>Домашняя кошка (Felis catus) — самое популярное животное-компаньон в мире, сочетающее в себе качества идеального хищника и преданного домашнего питомца. Эти удивительные существа живут бок о бок с человеком уже более 9 тысяч лет, но до сих пор сохраняют свою независимость и уникальные природные инстинкты.</p>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTtCGpkhAa00f98_GfHhK_wOgiAOQC4ORYvUQ">
                    <p>История взаимоотношений человека и кошки уникальна:
                        Ливийская кошка: все современные домашние породы произошли от дикого степного подвида.
                        Древний Египет: здесь кошек почитали как священных животных и сурово наказывали за причинение им вреда.
                        Средневековая Европа: кошек незаслуженно связывали с мистикой и суевериями.
                        Наши дни: кошки официально признаны главными домашними любимцами, помогающими людям справляться с одиночеством и с</p>
                    <img src="https://yac-wh-sb-prod-s3-media-07001.storage.yandexcloud.net/media/images/small-red-kitten-scottish-fold.max-2880x1820.format-jpeg_O0zIZ6x.jpg">
                    <p>В среднем домашние кошки живут от 12 до 17 лет, но при идеальном уходе и хорошей генетике этот срок может увеличиться до 18–20 лет и более.</p>
                  
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSu6Vj8RoAzjpsCOGfTVyIQW-HJW0Cb_B4cIA&s">
                       <h1>список кошек которыйх хочу завести  </h1>
            <ul>
                <li>Мейн-кун: Настоящие гиганты с рысьими кисточками на ушах. Обладают дружелюбным, «собачьим» характером и любят воду.</li>
                <li>Сиамская: Кошка с характерным окрасом колор-пойнт (темные лапы, хвост и мордочка) и голубыми глазами. Очень разговорчива и предана. </li>
                <li>Манчкин: Кошки с очень короткими лапами (результат естественной мутации). Несмотря на анатомию, они очень подвижны.</li>  
            </ul>
